server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    absolute_redirect off;

    location /api/import/ {
        client_max_body_size 64m;
        proxy_pass http://backend:8080/api/import/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location /api/ {
        # Must stay above HCW_MAX_UPLOAD_BYTES (backend/pkg/server/food_upload.go,
        # default 10MB) + its multipart overhead margin, or photo uploads 413
        # here before the backend's own limit is ever consulted.
        client_max_body_size 12m;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /webhook/ {
        client_max_body_size 20m;
        proxy_pass http://backend:8080/webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /mcp {
        proxy_pass http://backend:8080/mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
    }

    # nginx's bundled mime.types has no entry for .webmanifest, so the manifest went out as
    # application/octet-stream and Chrome refuses to install a shortcut from one. `default_type`
    # only fills in what the type table could not, so this names the manifest without replacing
    # the inherited table the way a `types {}` block here would.
    #
    # `=404` rather than the SPA fallback below: a missing manifest must fail as a missing
    # manifest, not arrive as an HTML document claiming to be JSON.
    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
