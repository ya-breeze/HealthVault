services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HCW_PORT: ${HCW_PORT:-8080}
      HCW_DBPATH: ${HCW_DBPATH:-/data/hcw.db}
      HCW_SEED_USERS: ${HCW_SEED_USERS:-}
      HCW_JWT_SECRET: ${HCW_JWT_SECRET:?HCW_JWT_SECRET must be set}
      HCW_COOKIE_SECURE: ${HCW_COOKIE_SECURE:-true}
      HCW_MCP_TOKEN: ${HCW_MCP_TOKEN:-}
      # Cloudflare Access sign-in exchange (POST /api/auth/cf-access). All
      # three default to empty; the endpoint 404s unless all three are set.
      # HCW_CF_ACCESS_TEAM_DOMAIN: the Access team domain, e.g.
      #   myteam.cloudflareaccess.com.
      # HCW_CF_ACCESS_AUD: the Access application's AUD tag.
      # HCW_CF_ACCESS_EMAIL_MAP: "email:username,..." mapping a verified
      #   Google identity to a HealthVault username, shaped like
      #   HCW_SEED_USERS.
      HCW_CF_ACCESS_TEAM_DOMAIN: ${HCW_CF_ACCESS_TEAM_DOMAIN:-}
      HCW_CF_ACCESS_AUD: ${HCW_CF_ACCESS_AUD:-}
      HCW_CF_ACCESS_EMAIL_MAP: ${HCW_CF_ACCESS_EMAIL_MAP:-}
      HCW_UPLOADS_DIR: ${HCW_UPLOADS_DIR:-/data/uploads}
      HCW_USDA_DB_PATH: ${HCW_USDA_DB_PATH:-/data/usda.db}
      HCW_OFF_DB_PATH: ${HCW_OFF_DB_PATH:-/data/off.db}
      HCW_OPENAI_API_KEY: ${HCW_OPENAI_API_KEY:-}
      HCW_OPENAI_MODEL: ${HCW_OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - ${HCW_DATA_PATH:?HCW_DATA_PATH must be set}:/data
    networks:
      - hcw-network
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8080/internal/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 2m

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${HCW_HTTP_PORT:?HCW_HTTP_PORT must be set}:80"
      - "${HCW_HTTPS_PORT:?HCW_HTTPS_PORT must be set}:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hcw-network
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 3 http://127.0.0.1:80/internal/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  hcw-network:
