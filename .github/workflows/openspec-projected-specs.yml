name: OpenSpec projected specs

on:
  pull_request:
    paths:
      - "openspec/**"

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install openspec CLI
        # Pinned to match the version this environment uses elsewhere. Bump
        # deliberately, alongside OPENSPEC_VERSION in the sibling Useful
        # repo's restore-container.sh, not implicitly.
        run: npm install -g @fission-ai/openspec@1.6.0

      - name: Regenerate projected specs
        run: scripts/generate-projected-specs.sh "origin/${{ github.base_ref }}"

      - name: Check for drift
        run: |
          git add -A -- openspec
          if ! git diff --cached --exit-code -- openspec/specs.projected; then
            echo "::error::openspec/specs.projected/ is stale or missing. Run 'make projected-specs' and commit the result."
            exit 1
          fi
